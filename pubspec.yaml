name: flutter_application_1
description: "MedCerto Web - protótipo web do app de lembrete de remédios."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2                 # chamadas à API (catálogo de remédios no Render)
  shared_preferences: ^2.3.2   # guarda os dados no navegador (no celular é SQLite)

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
